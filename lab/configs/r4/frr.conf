frr defaults traditional
hostname r4
log file /var/log/frr/frr.log informational
log timestamp precision 3
log record-priority
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.4/32
 ip ospf area 0
exit
!
interface eth1
 description to-r1
 ip address 10.0.14.2/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
exit
!
interface eth2
 description to-r5
 ip address 10.0.45.1/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
exit
!
interface eth3
 description to-h2
 ip address 10.1.4.1/24
 ip ospf area 0
 ip ospf cost 10
exit
!
router ospf
 ospf router-id 10.255.0.4
 log-adjacency-changes detail
 passive-interface lo
 passive-interface eth3
exit
!
line vty
!
