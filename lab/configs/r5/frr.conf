frr defaults traditional
hostname r5
log file /var/log/frr/frr.log informational
log timestamp precision 3
log record-priority
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.5/32
 ip ospf area 0
exit
!
interface eth1
 description to-r1
 ip address 10.0.15.2/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
exit
!
interface eth2
 description to-r4
 ip address 10.0.45.2/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
exit
!
interface eth3
 description to-h3
 ip address 10.1.5.1/24
 ip ospf area 0
 ip ospf cost 10
exit
!
router ospf
 ospf router-id 10.255.0.5
 log-adjacency-changes detail
 passive-interface lo
 passive-interface eth3
exit
!
line vty
!
