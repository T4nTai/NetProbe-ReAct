frr defaults traditional
hostname r1
log file /var/log/frr/frr.log informational
log timestamp precision 3
log record-priority
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.1/32
 ip ospf area 0
exit
!
interface eth1
 description to-sw1
 ip address 10.0.123.1/24
 ip ospf area 0
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 ip ospf priority 100
exit
!
interface eth2
 description to-r4
 ip address 10.0.14.1/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
exit
!
interface eth3
 description to-r5
 ip address 10.0.15.1/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
exit
!
interface eth4
 description to-isp
 ip address 172.16.0.1/30
exit
!
ip prefix-list EXT-PREFIXES seq 10 permit 203.0.113.0/24
ip prefix-list EXT-PREFIXES seq 20 permit 198.51.100.1/32
!
route-map BGP-TO-OSPF permit 10
 match ip address prefix-list EXT-PREFIXES
exit
!
router ospf
 ospf router-id 10.255.0.1
 log-adjacency-changes detail
 passive-interface lo
 redistribute bgp route-map BGP-TO-OSPF
exit
!
router bgp 65001
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 neighbor 172.16.0.2 remote-as 65100
 neighbor 172.16.0.2 timers 5 15
 !
 address-family ipv4 unicast
  network 10.1.2.0/24
  network 10.1.4.0/24
  network 10.1.5.0/24
  neighbor 172.16.0.2 activate
 exit-address-family
exit
!
line vty
!
