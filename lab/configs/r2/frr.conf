frr defaults traditional
hostname r2
log file /var/log/frr/frr.log informational
log timestamp precision 3
log record-priority
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.2/32
 ip ospf area 0
exit
!
interface eth1
 description to-sw1
 ip address 10.0.123.2/24
 ip ospf area 0
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 ip ospf priority 10
exit
!
interface eth2
 description to-h1
 ip address 10.1.2.1/24
 ip ospf area 0
 ip ospf cost 10
exit
!
router ospf
 ospf router-id 10.255.0.2
 log-adjacency-changes detail
 passive-interface lo
 passive-interface eth2
exit
!
line vty
!
